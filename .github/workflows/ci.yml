name: CI Pipeline

on:
  push:
    branches: [ "**" ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ===========================================
  # STAGE 1: Build & Unit Test
  # ===========================================
  build-and-unit-test:
    name: "🚀 Build & Unit Test"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile project
        working-directory: ./jmonkey-3d-gamebase
        run: |
          echo "🔨 Compiling project..."
          mvn clean compile -B -V

      - name: Run unit tests
        working-directory: ./jmonkey-3d-gamebase
        run: |
          echo "🧪 Running unit tests..."
          mvn test -B

      - name: Package JAR (for downstream jobs)
        working-directory: ./jmonkey-3d-gamebase
        run: |
          echo "📦 Packaging JAR..."
          mvn package -DskipTests -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            jmonkey-3d-gamebase/target/*.jar
            jmonkey-3d-gamebase/target/classes/**
          retention-days: 1

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            jmonkey-3d-gamebase/target/surefire-reports/**/*.xml
            jmonkey-3d-gamebase/target/surefire-reports/**/*.txt
          retention-days: 30

  # ================================================
  # STAGE 2: Parallel Quality Checks (Quality Gate)
  # ================================================
  
  # Job A: Code Quality Analysis
  code-quality-checks:
    name: "🔍 Code Quality (Checkstyle/PMD/SpotBugs)"
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: jmonkey-3d-gamebase/target/

      - name: Run quality checks
        working-directory: ./jmonkey-3d-gamebase
        run: |
          echo "🔍 Running code quality analysis..."
          echo "📋 Checkstyle..."
          mvn checkstyle:check -Pquality
          echo "🔍 PMD Analysis..."
          mvn pmd:check -Pquality  
          echo "🐛 SpotBugs Analysis..."
          mvn spotbugs:check -Pquality
          echo "✅ All quality checks completed!"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            jmonkey-3d-gamebase/target/checkstyle-result.xml
            jmonkey-3d-gamebase/target/pmd.xml
            jmonkey-3d-gamebase/target/spotbugsXml.xml
            jmonkey-3d-gamebase/target/site/**
          retention-days: 30

  # ===========================================
  # SUMMARY: Pipeline Status
  # ===========================================
  pipeline-status:
    name: "📊 Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [ build-and-unit-test, code-quality-checks ]
    if: always()
    
    steps:
      - name: Pipeline Summary
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "🚀 Build & Unit Test: ${{ needs.build-and-unit-test.result }}"
          echo "🔍 Code Quality: ${{ needs.code-quality-checks.result }}"
          echo "=========================="
          
          if [ "${{ needs.build-and-unit-test.result }}" == "failure" ]; then
            echo "❌ Critical path failed - build or unit tests failed"
            exit 1
          fi
          
          if [ "${{ needs.code-quality-checks.result }}" == "failure" ]; then
            echo "⚠️  Quality gate failed - check the reports"
            exit 1
          fi
          
          echo "✅ All checks passed!"