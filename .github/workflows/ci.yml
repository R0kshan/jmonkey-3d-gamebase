name: Java CI Pipeline

on:
  push:
    branches: [ "main", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main", "feature/*", "fix/*" ]
  workflow_dispatch: # To run it manually for testing

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  WORKING_DIR: '.'

# Grant empty default permissions at the workflow level, and grant only the minimum required permissions per job
# See : https://docs.github.com/en/actions/reference/security/secure-use#using-githubs-security-features
permissions: { }

jobs:
  # ===========================================
  # STAGE 1: Build & Unit Test
  # ===========================================
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # Tag v4

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # Tag v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build and Run Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean test -B

      # Upload the target folder so the Quality stage doesn't have to re-compile
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # Tag v7.0.0
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/
          retention-days: 1

  # ===========================================
  # STAGE 2: Quality gate
  # ===========================================
  quality-gate:
    name: "Quality gate"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # Tag v4

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # Tag v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # Download the artifacts from the previous job
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # Tag v8.0.1
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/

      # ===========================================
      # Steps to execute on push
      # ===========================================
      - name: Run Checkstyle
        if: github.event_name == 'push'
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn checkstyle:check -Pcheckstyle -B

      - name: Run PMD
        if: github.event_name == 'push'
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn pmd:check -Ppmd -B

      - name: Run Spotbugs
        if: github.event_name == 'push'
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn spotbugs:check -Pspotbugs -B

      - name: Upload code quality reports
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # Tag v7.0.0
        with:
          name: quality-reports
          path: |
            ${{ env.WORKING_DIR }}/target/site/*.html
            ${{ env.WORKING_DIR }}/target/checkstyle-result.xml
            ${{ env.WORKING_DIR }}/target/pmd.xml
          retention-days: 1

      # ===========================================
      # Steps to execute on Pull Requests
      # ===========================================
      - name: Run Checkstyle with Reviewdog
        if: github.event_name == 'pull_request'
        uses: dbelyaev/action-checkstyle@1df550cf7ca173631075cd649bbc52cfa6549cbd # Tag v3.8.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: 'github-pr-review'
          checkstyle_version: "13.3.0"
          checkstyle_config: ./config/checkstyle/checkstyle_checks.xml
          level: 'warning'
          filter_mode: 'nofilter'

      - name: Run PMD with Reviewdog
        if: github.event_name == 'pull_request'
        uses: kemsakurai/action-pmd@cc44fc8bc700fdd7b0a4644365c0958a2afc4ac6 # Tag v0.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: 'github-pr-review'
          checkstyle_version: "13.3.0"
          checkstyle_config: config/pmd/pmd_ruleset.xml
          level: 'warning'
          filter_mode: 'nofilter'


