name: Java CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  WORKING_DIR: '.'

jobs:
  # ===========================================
  # STAGE 1: Build & Unit Test
  # ===========================================
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build and Run Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean test -B

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/
          retention-days: 1

  # ===========================================
  # STAGE 2: Quality Gate
  # ===========================================
  quality-gate:
    name: "Quality Gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/

      - name: Run Quality Tools
        id: run-quality
        working-directory: ${{ env.WORKING_DIR }}
        # We don't use 'clean' here so we keep the downloaded artifacts
        run: mvn verify -Pquality -DskipTests
        continue-on-error: true

      - name: Reviewdog (Checkstyle)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-checkstyle@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          # Path to your custom config from the screenshot
          checkstyle_config: config/checkstyle/checkstyle.xml
          workdir: ${{ env.WORKING_DIR }}

      - name: Reviewdog (PMD)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-pmd@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          workdir: ${{ env.WORKING_DIR }}

      # This ensures the workflow still fails if Maven found issues,
      # blocking the PR from being merged.
      - name: Check Quality Status
        if: steps.run-quality.outcome == 'failure'
        run: |
          echo "Quality checks failed. Check the logs or PR comments above."
          exit 1