name: Java CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # To run it manually for testing

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  WORKING_DIR: 'jmonkey-3d-gamebase'

jobs:
  # ===========================================
  # STAGE 1: Build & Unit Test
  # ===========================================
  build:
    name: "🚀 Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build and Run Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean test -B

      # We upload the target folder so the Quality stage doesn't have to re-compile
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/
          retention-days: 1