name: Java CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # To run it manually for testing

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  WORKING_DIR: '.'

permissions:
  contents: read
  pull-requests: write  # Allows Reviewdog to post comments
  checks: write         # Allows the "Quality Gate" status to show up

jobs:
  # ===========================================
  # STAGE 1: Build & Unit Test
  # ===========================================
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build and Run Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean test -B

      # We upload the target folder so the Quality stage doesn't have to re-compile
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/
          retention-days: 1

  # ===========================================
  # STAGE 2: Quality gate
  # ===========================================
  quality-gate:
    name: "Quality gate"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      #- name: Run Checkstyle, PMD and Spotbugs
      #  working-directory: ${{ env.WORKING_DIR }}
        #run: mvn clean verify -Pquality -Dpmd.failOnViolation=false
      #  run: mvn pmd:pmd pmd:check -B -Dpmd.failOnViolation=false

      # We upload the target folder so the Quality stage doesn't have to re-compile
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/target/
          retention-days: 1

      - name: Run PMD with Reviewdog
        uses: kemsakurai/action-pmd@v0.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: 'github-pr-review'
          #rulesets_path: 'config/pmd/pmd-ruleset.xml'
          tool_name: 'pmd_reviewdog'
          level: 'warning'
          filter_mode: 'nofilter'
          #pmd_xml: target/pmd.xml
